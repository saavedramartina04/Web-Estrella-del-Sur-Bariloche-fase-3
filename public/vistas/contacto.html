<section class="vista-contacto">
    <h1>Contacto</h1>

    <form class="contacto-form" action="#" novalidate>
        <div class="input-group">
            <label for="contacto-nombre">Nombre</label>
            <input type="text" id="contacto-nombre" name="nombre">
        </div>

        <div class="input-group">
            <label for="contacto-email">Email</label>
            <input type="email" id="contacto-email" name="email">
        </div>

        <div class="input-group">
            <label for="contacto-comentarios">Comentarios</label>
            <textarea
                id="contacto-comentarios"
                name="comentarios"
            ></textarea>
        </div>

        <button type="submit">Enviar</button>
    </form>
</section>
